<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Window 4 - 2라운드 배경 고정</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  /* 무조건 중앙 고정 */
  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1280px;
    height: 720px;
    background: url("../img/window4/자산%2012.png") no-repeat center center;
    background-size: contain;
  }

  .character { position: absolute; bottom: 43px; left: 170px; width: 300px; z-index: 5; }
  .X { position: absolute; bottom: 140px; left: 550px; width: 440px; z-index: 2; }

  /* 💬 말풍선 위치 */
  .speech {
    position: absolute;
    bottom: 455px;
    left: 220px;
    width: 160px;
    z-index: 6;
  }

  /* 💬 틀렸을 때 말풍선 */
  .speech.wrong {
    bottom: 455px;
    left: 265px;
    width: 50px;
  }

  /* 💬 마지막 대사 말풍선 */
  .speech.end {
    bottom: 455px;
    left: 235px;
    width: 120px;
  }

  .hearts {
    position: absolute;
    top: 50px;
    left: 140px;
    display: flex;
    gap: 12px;
    z-index: 7;
  }
  .hearts img { width: 60px; }

  /* 점 고정 */
  .dot {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    border: 2px solid #111;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 999;
  }

  /* 윗줄 */
  .dot1 { top: 370px; left: 600px; }
  .dot2 { top: 370px; left: 780px; }
  .dot3 { top: 370px; left: 950px; }

  /* 아랫줄 */
  .dot4 { top: 450px; left: 600px; }
  .dot5 { top: 450px; left: 780px; }
  .dot6 { top: 440px; left: 950px; }

  #lineCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="lineCanvas" width="1280" height="720"></canvas>

    <div class="hearts">
      <img src="../img/window4/자산%2015.png" id="h1">
      <img src="../img/window4/자산%2015.png" id="h2">
      <img src="../img/window4/자산%2015.png" id="h3">
    </div>

    <img src="../img/window4/자산%2013.png" class="character" id="character">
    <img src="../img/window4/자산%209.png" class="X" id="X">
    <img src="../img/window4/자산%2017.png" class="speech" id="speech">

    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
    <div class="dot dot4"></div>
    <div class="dot dot5"></div>
    <div class="dot dot6"></div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const canvas = document.getElementById("lineCanvas");
    const ctx = canvas.getContext("2d");
    const hearts = document.querySelectorAll(".hearts img");
    const dots = document.querySelectorAll(".dot");
    const character = document.getElementById("character");
    const speech = document.getElementById("speech");
    const X = document.getElementById("X");

    let selected = null;
    let mistakes = 0;
    let round = 1;
    let activeLines = [];
    let matchedPairs = [];

    const correctPairs1 = { dot1: "dot5", dot2: "dot6", dot3: "dot4" };

    const normalChar = "../img/window4/자산%2013.png";
    const normalSpeech = "../img/window4/자산%2017.png";
    const wrongChar = "../img/window4/자산%2011.png";
    const wrongSpeech = "../img/window4/자산%2019.png";
    const endSpeech = "../img/window4/자산%2021.png";

    // 점 중심 좌표
    function getDotCenter(dot) {
      const rect = dot.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2 - stageRect.left,
        y: rect.top + rect.height / 2 - stageRect.top
      };
    }

    // 선 그리기
    function drawLine(dotA, dotB, color = "white") {
      const a = getDotCenter(dotA);
      const b = getDotCenter(dotB);
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      return { a, b, color };
    }

    function redrawLines() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      activeLines.forEach(l => {
        ctx.strokeStyle = l.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(l.a.x, l.a.y);
        ctx.lineTo(l.b.x, l.b.y);
        ctx.stroke();
      });
    }

    // ❌ 틀렸을 때
    function wrongAnswer(lineData) {
      mistakes++;
      if (mistakes <= 3) hearts[mistakes - 1].src = "../img/window4/자산%2016.png";

      setTimeout(() => {
        activeLines = activeLines.filter(l => l !== lineData);
        redrawLines();
      }, 600);

      character.src = wrongChar;
      speech.src = wrongSpeech;
      speech.className = "speech wrong"; // ❗ 단순 교체만

      if (mistakes >= 3) {
        setTimeout(() => {
          speech.src = endSpeech;
          speech.className = "speech end"; // ❗ 단순 교체만
          setTimeout(startRobotCheck, 2000);
        }, 2000);
      }
    }
    
    function startCaptcha() {
      // 1) 기존 라운드 요소 전부 숨김
      const toHide = document.querySelectorAll('.dot, .speech, .character, .X, .hearts');
      toHide.forEach(el => el && (el.style.display = 'none'));
      const canvas = document.getElementById('lineCanvas');
       if (canvas) canvas.style.display = 'none';

      // 이미 만들어져 있으면 중복 생성 방지
      if (document.getElementById('captcha-stage')) return;

      // 2) 캡차 스테이지 컨테이너 생성
      const captcha = document.createElement('div');
      captcha.id = 'captcha-stage';
      // 위치/크기: 기존 stage(1280x720) 안을 꽉 채움
      captcha.style.position = 'absolute';
      captcha.style.inset = '0';
      captcha.style.width = '1280px';
      captcha.style.height = '720px';
      captcha.style.margin = '0 auto';
      captcha.style.pointerEvents = 'auto';
      captcha.style.zIndex = '20';

      // 3) 배경(버튼 포함된 이미지) 삽입
      //    ※ 여기서 bg 파일명은 네가 실제 사용하는 캡차용 배경으로 바꿔도 됨
      captcha.innerHTML = `
        <img src="../img/window4/bg.png"
            alt="captcha background"
            style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none;">
      `;

      // 4) stage에 추가
      const stage = document.getElementById('stage');
      stage.appendChild(captcha);
      // (다음 단계에서) selectable 이미지, 클릭영역, verify/refresh/i 핫스팟, 팝업 등을 붙일 예정
      // 5) 버튼 핫스팟 레이어 (verify / refresh / info)
      const ui = document.createElement('div');
      ui.id = 'captcha-ui';
      ui.style.position = 'absolute';
      ui.style.inset = '0';
      ui.style.zIndex = '2100';
      captcha.appendChild(ui);

      // 공통 스타일
      function makeHotspot(cls, left, top, w, h) {
        const el = document.createElement('div');
        el.className = 'hotspot ' + cls;
        el.style.position = 'absolute';
        el.style.left = left + 'px';
        el.style.top  = top + 'px';
        el.style.width  = w + 'px';
        el.style.height = h + 'px';
        el.style.cursor = 'pointer';
        el.style.background = 'rgba(255,255,255,0)'; // 클릭 영역만 (보이게 하려면 0.1~0.2로 잠깐 조정해도 됨)
        return el;
      }

      /* ⬇️ 임시 좌표(1280x720 기준). 배경의 아이콘 위치에 맞춰 숫자만 조정해줘.
        - verify:  오른쪽 하단 버튼
        - refresh: 왼쪽 하단 새로고침
        - info:    우상단 'i' 아이콘 근처
      */
      const hsVerify  = makeHotspot('verify', 1050, 630, 180, 60);
      const hsRefresh = makeHotspot('refresh', 120,  630, 140, 60);
      const hsInfo    = makeHotspot('info',   1120,  80,  40,  40);

      ui.appendChild(hsVerify);
      ui.appendChild(hsRefresh);
      ui.appendChild(hsInfo);

      // 동작: info = hover 표시(툴팁), refresh = 선택 초기화, verify = 정답 검사(다음 단계에서 연결)
      let infoTip = null;
      hsInfo.addEventListener('mouseenter', () => {
        if (infoTip) return;
        infoTip = document.createElement('div');
        infoTip.textContent = '정답은 2개입니다';
        infoTip.style.position = 'absolute';
        infoTip.style.left = (hsInfo.offsetLeft - 10) + 'px';
        infoTip.style.top  = (hsInfo.offsetTop + hsInfo.offsetHeight + 8) + 'px';
        infoTip.style.padding = '8px 10px';
        infoTip.style.borderRadius = '8px';
        infoTip.style.background = 'rgba(0,0,0,0.8)';
        infoTip.style.color = '#fff';
        infoTip.style.font = '14px/1.2 system-ui, -apple-system, Segoe UI, Roboto';
        infoTip.style.zIndex = '2200';
        ui.appendChild(infoTip);
      });
      hsInfo.addEventListener('mouseleave', () => {
        if (infoTip) { infoTip.remove(); infoTip = null; }
      });

      // refresh = 선택 초기화 (선택 로직은 다음 단계에서 붙일 예정이므로, 지금은 이벤트 연결만)
      hsRefresh.addEventListener('click', () => {
        // 다음 단계에서 selectable 요소 선택 배열을 초기화하는 함수를 연결할 거야.
        // 예: resetSelections();
        console.log('[captcha] refresh clicked');
      });

      // verify = 정답 검사 트리거 (다음 단계에서 실제 검사 함수 연결)
      hsVerify.addEventListener('click', () => {
        // 다음 단계에서 checkAnswers()와 팝업 표시를 연결할 거야.
        console.log('[captcha] verify clicked');
      });

    }

    // ✅ 맞았을 때
    function rightAnswer() {
      character.src = normalChar;
      speech.src = normalSpeech;
      speech.className = "speech"; // 기본 위치로 복귀
    }

    // 🎬 2라운드로 이동
    function nextRound() {
      round = 2;
      mistakes = 0;
      activeLines = [];
      matchedPairs = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stage.style.background = "url('../img/window4/자산%2012.png') no-repeat center center";
      stage.style.backgroundSize = "contain";

      X.src = "../img/window4/자산%2014.png";
      hearts.forEach(h => (h.src = "../img/window4/자산%2015.png"));
      character.src = normalChar;
      speech.src = normalSpeech;
      speech.className = "speech";
      X.style.bottom = "143px";  // y좌표 (아래쪽 여백)
      X.style.left = "550px";    // x좌표 (가로 위치)
      X.style.width = "450px";   // 크기

    }

    // 🖱️ 점 클릭 로직
    dots.forEach(dot => {
      dot.addEventListener("click", () => {
        if (!selected) {
          selected = dot;
          dot.style.background = "rgba(255,255,255,0.8)";
        } else {
          if (dot === selected) return;

          const isCorrect =
            round === 1 &&
            correctPairs1[selected.classList[1]] === dot.classList[1] &&
            !matchedPairs.includes(selected.classList[1]) &&
            !matchedPairs.includes(dot.classList[1]);

          const line = drawLine(selected, dot);
          activeLines.push(line);

          if (round === 1) {
            if (isCorrect) {
              selected.style.background = "rgba(0,255,0,0.4)";
              dot.style.background = "rgba(0,255,0,0.4)";
              rightAnswer();
              matchedPairs.push(selected.classList[1], dot.classList[1]);
              if (matchedPairs.length === 6) setTimeout(nextRound, 1000);
            } else {
              wrongAnswer(line);
            }
          } else {
            wrongAnswer(line); // 2라운드는 전부 오답
          }

          selected.style.background = "rgba(255,255,255,0.5)";
          selected = null;
        }
      });
    });

    window.addEventListener("resize", redrawLines);
    function startRobotCheck() {
      // 이미 떠있으면 중복 생성 방지
      if (document.getElementById('robot-check')) return;

      const stage = document.getElementById('stage');

      // 반투명 오버레이
      const overlay = document.createElement('div');
      overlay.id = 'robot-check';
      overlay.style.position = 'absolute';
      overlay.style.inset = '0';
      overlay.style.background = 'rgba(0,0,0,0.45)';
      overlay.style.zIndex = '25';
      overlay.style.zIndex = '2000';
      overlay.style.display = 'flex';
      overlay.style.alignItems = 'center';
      overlay.style.justifyContent = 'center';

      // 로봇이 아닙니다 카드
      const card = document.createElement('div');
      card.style.width = '520px';
      card.style.background = '#fff';
      card.style.borderRadius = '10px';
      card.style.boxShadow = '0 20px 60px rgba(0,0,0,.35)';
      card.style.padding = '22px 24px';
      card.style.fontFamily = 'system-ui, -apple-system, Segoe UI, Roboto';
      card.style.color = '#222';

      // 상단 영역 (체크박스 + 라벨)
      const top = document.createElement('div');
      top.style.display = 'flex';
      top.style.alignItems = 'center';
      top.style.gap = '14px';
      top.style.marginBottom = '14px';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = 'rbx';
      checkbox.style.width = '24px';
      checkbox.style.height = '24px';
      checkbox.style.cursor = 'pointer';

      const label = document.createElement('label');
      label.htmlFor = 'rbx';
      label.textContent = "I'm not a robot";
      label.style.fontSize = '20px';
      label.style.cursor = 'pointer';

      top.appendChild(checkbox);
      top.appendChild(label);

      // 하단 영역 (확인 버튼 + 안내)
      const bottom = document.createElement('div');
      bottom.style.display = 'flex';
      bottom.style.alignItems = 'center';
      bottom.style.justifyContent = 'space-between';
      bottom.style.marginTop = '10px';

      const hint = document.createElement('div');
      hint.textContent = '이 확인 후 이미지 검증 단계로 진행됩니다.';
      hint.style.fontSize = '13px';
      hint.style.color = '#666';

      const btn = document.createElement('button');
      btn.textContent = '확인';
      btn.style.padding = '10px 16px';
      btn.style.border = '1px solid #e0e0e0';
      btn.style.borderRadius = '8px';
      btn.style.background = '#1976d2';
      btn.style.color = '#fff';
      btn.style.fontSize = '14px';
      btn.style.cursor = 'pointer';

      // 버튼 동작
      btn.addEventListener('click', () => {
        if (!checkbox.checked) {
          // 체크 안 했을 때 살짝 강조
          checkbox.style.outline = '2px solid #f44336';
          setTimeout(() => (checkbox.style.outline = 'none'), 500);
          return;
        }
        // 통과 → 오버레이 제거 → 캡차 시작
        overlay.remove();
        startCaptcha();
      });

      bottom.appendChild(hint);
      bottom.appendChild(btn);

      // 구성 조립
      card.appendChild(top);
      card.appendChild(bottom);
      overlay.appendChild(card);
      stage.appendChild(overlay);
    }

  </script>
</body>
</html>
