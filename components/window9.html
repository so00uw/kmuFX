<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Window 9 - Camera Auto Capture</title>

<style>
/* ✅ 도트 폰트 추가 */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
@import url('https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap');

body {
  margin: 0;
  background: #000;
  overflow: hidden;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'DungGeunMo', monospace;
  color: white;
}

.camera-wrapper {
  position: relative;
  display: inline-block;
}

/* 🔹 프레임 이미지 */
#frame {
  position: relative;
  display: block;
  height: 90vh;
  z-index: 2;
  pointer-events: none;
}

/* 🔹 카메라 화면 */
#camera {
  position: absolute;
  top: 55%;
  left: 51%;
  transform: translate(-50%, -50%);
  object-fit: cover;
  width: 85%;
  height: 85%;
  z-index: 1;
}

/* 🔹 카운트다운 숫자 */
#countdown {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 100px;
  color: white;
  text-shadow: 0 0 20px rgba(0,0,0,0.8);
  z-index: 3;
}

/* 🔹 엔딩 화면 (X is You) */
#ending-screen {
  position: fixed;
  inset: 0;
  background: #000;
  color: #fff;
  display: none;
  justify-content: center;
  align-items: center;
  font-family: 'Press Start 2P', monospace; /* ✅ 도트 스타일 폰트 적용 */
  font-size: 50px;
  letter-spacing: 2px;
  text-shadow:
    0 0 8px rgba(255, 255, 255, 0.8),
    0 0 15px rgba(255, 255, 255, 0.5);
  z-index: 999;
  animation: fadeIn 2s ease forwards;
}

/* 🔹 페이드인 효과 */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>
<div class="camera-wrapper">
  <video id="camera" autoplay playsinline></video>
  <img id="frame" src="../img/window9/111.png" alt="camera frame">
  <div id="countdown"></div>
</div>

<!-- ✅ 엔딩 화면 -->
<div id="ending-screen">X is You</div>

<script>
const video = document.getElementById('camera');
const frame = document.getElementById('frame');
const countdown = document.getElementById('countdown');
const endingScreen = document.getElementById('ending-screen');

// 🔹 카메라 시작
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => {
      // ✅ 3초 후 카운트다운 시작
      setTimeout(startCountdown, 3000);
    });
  })
  .catch(err => {
    alert('카메라 접근 권한이 필요합니다.');
    console.error(err);
  });

// 🔹 카운트다운
function startCountdown() {
  let count = 3;
  countdown.textContent = count;

  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      countdown.textContent = count;
    } else {
      clearInterval(timer);
      countdown.textContent = '';
      takePhoto();
    }
  }, 1000);
}

// 🔹 사진 촬영 (저장은 내부적으로만) → 바로 엔딩 전환
function takePhoto() {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const overlay = new Image();
  overlay.src = frame.src;
  overlay.onload = () => {
    ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);
    showEnding();
  };
}

// 🔹 엔딩 화면 표시 후 window1.html로 이동
function showEnding() {
  endingScreen.style.display = 'flex';
  setTimeout(() => {
    window.location.href = "window1.html";
  }, 3000);
}
</script>
</body>
</html>
